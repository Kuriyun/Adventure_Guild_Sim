<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quests - Dark Fantasy RPG</title>
    <link rel="stylesheet" href="game-style.css">
    <style>
        .quest-page-layout {
            display: flex;
            max-width: 1400px;
            margin: 0 auto;
            gap: 20px;
            padding: 20px;
            min-height: 100vh;
        }

        .quest-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .quest-board {
            flex: 0 0 420px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .quest-only-header {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            background: linear-gradient(135deg, #1a1f3a 0%, #2d3142 100%);
            border: 2px solid #d4af37;
            border-radius: 10px;
            padding: 18px 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .quest-only-title {
            color: #d4af37;
            font-size: 26px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
            margin-left: 180px;
        }

        .hub-back-button {
            position: fixed;
            left: 18px;
            top: 18px;
            z-index: 100;
            width: auto;
            min-width: 160px;
            padding: 12px 18px;
            background: linear-gradient(135deg, #3d4452 0%, #4d5562 100%);
            border: 2px solid #d4af37;
            color: #d4af37;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Georgia', serif;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.35);
        }

        .quest-highlight {
            background: linear-gradient(135deg, #1a1f3a 0%, #2d3142 100%);
            border: 2px solid #d4af37;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .quest-highlight h2,
        .quest-board h2 {
            color: #d4af37;
            margin-bottom: 12px;
        }

        .quest-main-title {
            font-size: 28px;
            color: #f5d76e;
            margin-bottom: 10px;
        }

        .quest-meta {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
            color: #d0d0d0;
            font-size: 13px;
        }

        .quest-callout {
            background: rgba(212, 175, 55, 0.08);
            border-left: 4px solid #d4af37;
            padding: 12px 14px;
            border-radius: 6px;
            color: #f0e2a3;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .empty-quest-message {
            background: rgba(212, 175, 55, 0.08);
            border: 1px dashed #d4af37;
            color: #f0e2a3;
            border-radius: 8px;
            padding: 18px 16px;
            font-size: 16px;
            text-align: center;
            margin-top: 10px;
        }

        .quest-action-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .quest-cta,
        .accept-btn {
            flex: 1;
            min-width: 160px;
            padding: 12px 14px;
            background: linear-gradient(135deg, #d4af37 0%, #f0d968 100%);
            border: none;
            color: #150f07;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Georgia', serif;
        }

        .secondary-btn {
            flex: 1;
            min-width: 160px;
            padding: 12px 14px;
            background: linear-gradient(135deg, #3d4452 0%, #4d5562 100%);
            border: 2px solid #d4af37;
            color: #d4af37;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Georgia', serif;
        }

        .quest-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .quest-item {
            background: linear-gradient(135deg, #0f1219 0%, #1a1f3a 100%);
            border: 2px solid #3d4452;
            border-radius: 8px;
            padding: 15px;
        }

        .quest-item.active {
            border-color: #d4af37;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }

        .quest-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .quest-item h3 {
            color: #d4af37;
            font-size: 16px;
        }

        .quest-badge {
            font-size: 11px;
            background: #3d4452;
            color: #d4af37;
            border-radius: 4px;
            padding: 4px 8px;
            font-weight: bold;
        }

        .quest-item p {
            color: #b0b0b0;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .quest-item .reward {
            color: #ffd700;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        @media (max-width: 900px) {
            .quest-page-layout {
                flex-direction: column;
            }

            .quest-board {
                flex-basis: auto;
            }
        }
    </style>
</head>

<body>
    <button class="hub-back-button" onclick="window.location.href='index.html'">← Back to Hub</button>

    <div class="quest-page-layout">
        <div class="quest-panel">
            <div class="quest-only-header">
                <div class="quest-only-title">Quest Board</div>
            </div>

            <div class="card quest-highlight" id="currentObjective">
                <h2>Current Objective</h2>
                <div id="objectiveContent" class="empty-quest-message">You currently don't have any Quests.</div>
            </div>
        </div>

        <div class="quest-board">
            <div class="card">
                <h2>Quest Board</h2>
                <div id="questList" class="quest-list"></div>
            </div>
        </div>
    </div>

    <script>
        const currentObjective = document.getElementById('currentObjective');
        const objectiveContent = document.getElementById('objectiveContent');
        const questList = document.getElementById('questList');

        function renderCurrentObjective() {
            const hasQuestContent = currentObjective.querySelector('.quest-main-title, .quest-meta, .quest-callout, .quest-progress, .quest-reward, .quest-cta');

            if (!hasQuestContent) {
                objectiveContent.textContent = "You currently don't have any Quests.";
                objectiveContent.style.display = 'block';
            }
        }

        function formatQuestReward(quest) {
            return `Gold: ${quest.goldReward} | Item: ${quest.itemReward} | EXP: ${quest.expReward}`;
        }

        function renderQuestBoard(quests) {
            questList.innerHTML = '';

            quests.forEach((quest) => {
                const questItem = document.createElement('div');
                questItem.className = 'quest-item';
                questItem.innerHTML = `
                    <div class="quest-item-header">
                        <h3>${quest.title}</h3>
                        <span class="quest-badge">Lvl ${quest.level}</span>
                    </div>
                    <p>${quest.description}</p>
                    <div class="reward">${formatQuestReward(quest)}</div>
                    <button class="accept-btn">Accept Quest</button>
                `;

                questItem.querySelector('.accept-btn').addEventListener('click', () => acceptQuest(questItem, quest));
                questList.appendChild(questItem);
            });
        }

        function acceptQuest(questCard, quest) {
            currentObjective.innerHTML = `
                <h2>Current Objective</h2>
                <div class="quest-main-title">${quest.title}</div>
                <div class="quest-meta">
                    <span>📍 ${quest.location}</span>
                    <span>Lvl ${quest.level}</span>
                </div>
                <div class="quest-callout">${quest.description}</div>
                <div class="quest-progress">
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 0%"></div>
                    </div>
                    <span class="progress-text">0 / 1 started</span>
                </div>
                <div class="quest-reward">
                    <span>${formatQuestReward(quest)}</span>
                </div>
                <div class="quest-action-row" style="margin-top: 16px;">
                    <button class="quest-cta">Quest Accepted</button>
                </div>
            `;

            questCard.remove();
        }

        async function loadQuests() {
            try {
                const response = await fetch('quests.json', { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error('Quest file request failed');
                }

                const quests = await response.json();
                renderQuestBoard(quests);
            } catch (error) {
                console.error('Could not load quests from quests.json', error);
                questList.innerHTML = '<div class="empty-quest-message">Unable to load quests from quests.json.</div>';
            }
        }

        loadQuests();
        renderCurrentObjective();
    </script>
</body>

</html>
