<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quests - Dark Fantasy RPG</title>
    <link rel="stylesheet" href="game-style.css">
    <style>
        .quest-page-layout {
            display: flex;
            max-width: 1400px;
            margin: 0 auto;
            gap: 20px;
            padding: 20px;
            min-height: 100vh;
        }

        .quest-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .quest-board {
            flex: 0 0 420px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .quest-only-header {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            background: linear-gradient(135deg, #1a1f3a 0%, #2d3142 100%);
            border: 2px solid #d4af37;
            border-radius: 10px;
            padding: 18px 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .quest-only-title {
            color: #d4af37;
            font-size: 26px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
            margin-left: 0;
            text-align: left;
            line-height: 1.4;
            font-weight: 400;
        }

        .quest-only-title .highlight-title {
            font-weight: 700;
        }

        .hub-back-button {
            position: fixed;
            left: 18px;
            top: 18px;
            z-index: 100;
            width: auto;
            min-width: 160px;
            padding: 12px 18px;
            background: linear-gradient(135deg, #3d4452 0%, #4d5562 100%);
            border: 2px solid #d4af37;
            color: #d4af37;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Georgia', serif;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.35);
        }

        .quest-highlight {
            background: linear-gradient(135deg, #1a1f3a 0%, #2d3142 100%);
            border: 2px solid #d4af37;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .quest-highlight h2,
        .quest-board h2 {
            color: #d4af37;
            margin-bottom: 12px;
        }

        .quest-main-title {
            font-size: 28px;
            color: #f5d76e;
            margin-bottom: 10px;
        }

        .quest-meta {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
            color: #d0d0d0;
            font-size: 13px;
        }

        .quest-callout {
            background: rgba(212, 175, 55, 0.08);
            border-left: 4px solid #d4af37;
            padding: 12px 14px;
            border-radius: 6px;
            color: #f0e2a3;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .empty-quest-message {
            background: rgba(212, 175, 55, 0.08);
            border: 1px dashed #d4af37;
            color: #f0e2a3;
            border-radius: 8px;
            padding: 18px 16px;
            font-size: 16px;
            text-align: center;
            margin-top: 10px;
        }

        .quest-action-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .quest-cta,
        .accept-btn {
            flex: 1;
            min-width: 160px;
            padding: 12px 14px;
            background: linear-gradient(135deg, #d4af37 0%, #f0d968 100%);
            border: none;
            color: #150f07;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Georgia', serif;
        }

        .secondary-btn {
            flex: 1;
            min-width: 160px;
            padding: 12px 14px;
            background: linear-gradient(135deg, #3d4452 0%, #4d5562 100%);
            border: 2px solid #d4af37;
            color: #d4af37;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Georgia', serif;
        }

        .quest-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .active-quest-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .active-quest-item {
            background: linear-gradient(135deg, #0f1219 0%, #1a1f3a 100%);
            border: 2px solid #d4af37;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.15);
        }

        .quest-item {
            background: linear-gradient(135deg, #0f1219 0%, #1a1f3a 100%);
            border: 2px solid #3d4452;
            border-radius: 8px;
            padding: 15px;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .quest-item.active {
            border-color: #d4af37;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }

        .quest-item.flash {
            animation: questPulse 0.6s ease;
            border-color: #d4af37;
            box-shadow: 0 0 18px rgba(212, 175, 55, 0.5);
        }

        @keyframes questPulse {
            0% { transform: translateX(0); box-shadow: 0 0 0 rgba(212, 175, 55, 0); }
            20% { transform: translateX(-4px); }
            40% { transform: translateX(4px); }
            60% { transform: translateX(-3px); }
            80% { transform: translateX(3px); }
            100% { transform: translateX(0); box-shadow: 0 0 18px rgba(212, 175, 55, 0.5); }
        }

        .quest-notification {
            position: fixed;
            right: 20px;
            top: 20px;
            z-index: 200;
            min-width: 220px;
            max-width: 300px;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.3px;
            border: 1px solid #d4af37;
            background: rgba(20, 24, 33, 0.92);
            color: #f0e2a3;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
            opacity: 0;
            transform: translateY(-8px);
            transition: opacity 0.25s ease, transform 0.25s ease;
            pointer-events: none;
        }

        .quest-notification.show {
            opacity: 1;
            transform: translateY(0);
        }

        .quest-notification.error {
            border-color: #ff8c6b;
            background: rgba(47, 22, 18, 0.95);
            color: #ffd1c4;
        }

        .quest-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .quest-item h3 {
            color: #d4af37;
            font-size: 16px;
        }

        .quest-badge {
            font-size: 11px;
            background: #3d4452;
            color: #d4af37;
            border-radius: 4px;
            padding: 4px 8px;
            font-weight: bold;
        }

        .quest-item p {
            color: #b0b0b0;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .quest-item .reward {
            color: #ffd700;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        @media (max-width: 900px) {
            .quest-page-layout {
                flex-direction: column;
            }

            .quest-board {
                flex-basis: auto;
            }
        }
    </style>
</head>

<body>
    <button class="hub-back-button" onclick="window.location.href='index.html'">← Back to Hub</button>

    <div id="questNotification" class="quest-notification" aria-live="polite"></div>

    <div class="quest-page-layout">
        <div class="quest-panel">
            <div class="quest-only-header">
                <div class="quest-only-title"><span class="highlight-title">Quest Board</span> - Here you can accept quests from the Adventueres Guild</div>
            </div>

            <div class="card quest-highlight" id="currentObjective">
                <h2>Current Objective</h2>
                <div id="objectiveContent" class="empty-quest-message">You currently don't have any Quests.</div>
            </div>
        </div>

        <div class="quest-board">
            <div class="card">
                <h2>Quest Board</h2>
                <div id="questList" class="quest-list"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script>
        const currentObjective = document.getElementById('currentObjective');
        const objectiveContent = document.getElementById('objectiveContent');
        const questList = document.getElementById('questList');
        const questNotification = document.getElementById('questNotification');
        const currentCharacterId = 1; // TODO: Replace with actual character ID from session or context
        const maxActiveQuests = 3;
        let allQuests = [];
        let activeQuests = [];

        function normalizeQuest(rawQuest) {
            return {
                id: rawQuest.id,
                title: rawQuest.name,
                description: rawQuest.description,
                level: Number(rawQuest.level_requirement ?? 0),
                goldReward: Number(rawQuest.gold_reward ?? 0),
                expReward: Number(rawQuest.experience_reward ?? 0),
                itemReward: 'N/A'
            };
        }

        async function testAcceptQuestFunction() {
            const { data, error } = await supabaseClient.functions.invoke(
                'accept-quest',
                {
                    body: {
                        quest_id: 1
                    }
                }
            );

            console.log('Function response:', data);
            console.log('Function error:', error);
        }

        testAcceptQuestFunction();

        function showQuestNotification(message, isError = false) {
            questNotification.textContent = message;
            questNotification.classList.toggle('error', isError);
            questNotification.classList.add('show');

            window.clearTimeout(showQuestNotification.timeoutId);
            showQuestNotification.timeoutId = window.setTimeout(() => {
                questNotification.classList.remove('show');
            }, 1800);
        }

        function renderCurrentObjective() {
            if (activeQuests.length === 0) {
                currentObjective.innerHTML = `
                    <h2>Current Objective</h2>
                    <div id="objectiveContent" class="empty-quest-message">You currently don't have any Quests.</div>
                `;
                return;
            }

            const activeQuestMarkup = activeQuests.map((quest) => `
                <div class="active-quest-item">
                    <div class="quest-item-header">
                        <h3>${quest.title}</h3>
                        <span class="quest-badge">Lvl ${quest.level}</span>
                    </div>
                    <div class="quest-meta">
                        <span>Level ${quest.level}</span>
                    </div>
                    <div class="quest-callout">${quest.description}</div>
                    <div class="quest-progress">
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: 0%"></div>
                        </div>
                        <span class="progress-text">0 / 1 started</span>
                    </div>
                    <div class="quest-reward">
                        <span>Gold: ${quest.goldReward} | EXP: ${quest.expReward}</span>
                    </div>
                    <div class="quest-action-row" style="margin-top: 12px;">
                        <button class="secondary-btn abandon-btn" data-quest-title="${quest.title}">Abandon Quest</button>
                    </div>
                </div>
            `).join('');

            currentObjective.innerHTML = `
                <h2>Current Objective</h2>
                <div class="active-quest-list">${activeQuestMarkup}</div>
            `;

            currentObjective.querySelectorAll('.abandon-btn').forEach((button) => {
                button.addEventListener('click', () => abandonQuest(button.dataset.questTitle));
            });
        }

        function formatQuestReward(quest) {
            return `Gold: ${quest.goldReward} | EXP: ${quest.expReward}`;
        }

        function abandonQuest(questTitle) {
            const questIndex = activeQuests.findIndex((quest) => quest.title === questTitle);

            if (questIndex === -1) {
                return;
            }

            const [abandonedQuest] = activeQuests.splice(questIndex, 1);
            renderCurrentObjective();
            renderQuestBoard(allQuests.filter((quest) => !activeQuests.some((activeQuest) => activeQuest.title === quest.title)));
            showQuestNotification(`${abandonedQuest.title} has been abandoned.`);
        }

        function renderQuestBoard(quests) {
            questList.innerHTML = '';

            const boardQuests = quests.filter((quest) => !activeQuests.some((activeQuest) => activeQuest.title === quest.title));

            boardQuests.forEach((quest) => {
                const questItem = document.createElement('div');
                questItem.className = 'quest-item';
                questItem.innerHTML = `
                    <div class="quest-item-header">
                        <h3>${quest.title}</h3>
                        <span class="quest-badge">Lvl ${quest.level}</span>
                    </div>
                    <p>${quest.description}</p>
                    <div class="reward">${formatQuestReward(quest)}</div>
                    <button class="accept-btn">Accept Quest</button>
                `;

                questItem.querySelector('.accept-btn').addEventListener('click', () => acceptQuest(questItem, quest));
                questList.appendChild(questItem);
            });
        }

        async function acceptQuest(questCard, quest) {
            if (activeQuests.length >= maxActiveQuests) {
                questCard.classList.remove('flash');
                void questCard.offsetWidth;
                questCard.classList.add('flash');
                showQuestNotification('You can only have up to 3 active quests at a time.', true);
                return;
            }

            if (activeQuests.some((activeQuest) => activeQuest.id === quest.id)) {
                questCard.classList.remove('flash');
                void questCard.offsetWidth;
                questCard.classList.add('flash');
                showQuestNotification('This quest is already active.', true);
                return;
            }

            // Insert quest into character_quests
            const { error } = await supabaseClient
                .from('character_quests')
                .insert({
                    quest_id: quest.id,
                    character_id: currentCharacterId
                });

            if (error) {
                console.error('Could not accept quest:', error);
                showQuestNotification(`Could not accept quest: ${error.message}`, true);
                return;
            }

            // Only update the UI after the database insert succeeded
            activeQuests.push(quest);

            renderCurrentObjective();
            renderQuestBoard(
                allQuests.filter(
                    (availableQuest) =>
                        !activeQuests.some(
                            (activeQuest) => activeQuest.id === availableQuest.id
                        )
                )
            );

            questCard.remove();

            showQuestNotification(`${quest.title} accepted!`);
        }

        async function loadQuests() {
            try {
                const { data, error } = await supabaseClient
                    .from('quests')
                    .select('*')
                    .order('level_requirement', { ascending: true });

                if (error) {
                    throw error;
                }

                if (!data || data.length === 0) {
                    questList.innerHTML = '<div class="empty-quest-message">No quests are available yet.</div>';
                    return;
                }

                allQuests = data.map(normalizeQuest);
                renderQuestBoard(allQuests);
            } catch (error) {
                console.error('Could not load quests from database', error);
                const detail = error?.message || 'Unknown database error';
                questList.innerHTML = `<div class="empty-quest-message">Unable to load quests from the database.<br><small>${detail}</small></div>`;
                showQuestNotification(`Quest load failed: ${detail}`, true);
            }
        }

        loadQuests();
        renderCurrentObjective();
    </script>
</body>

</html>
