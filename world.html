<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>World - Dark Fantasy RPG</title>

    <link rel="stylesheet" href="world.css">
</head>

<body>

    <div class="world-container">

        <!-- Header -->
        <header class="world-header">

            <div>
                <h1>🌍 World</h1>
                <p>Explore the lands and discover what awaits you.</p>
            </div>

            <a href="hub.html" class="back-button">
                ← Back to Hub
            </a>

        </header>


        <!-- Main World Interface -->
        <main class="world-interface">


            <!-- =====================================================
                 LOCATIONS
                 ===================================================== -->

            <aside class="location-sidebar">

                <div class="sidebar-header">
                    <h2>Locations</h2>
                    <p>Select a location to explore.</p>
                </div>

                <div id="locationList" class="location-list">
                    <!-- Locations inserted here -->
                </div>

            </aside>


            <!-- =====================================================
                 SUBLOCATIONS
                 ===================================================== -->

            <aside class="sublocation-sidebar" id="sublocationSidebar">

                <div class="sidebar-header">
                    <h2 id="sublocationTitle">Sublocations</h2>
                    <p id="sublocationDescription">
                        Select a sublocation to explore.
                    </p>
                </div>

                <div id="sublocationList" class="location-list">
                    <!-- Sublocations inserted here -->
                </div>

            </aside>


            <!-- =====================================================
                 MAP
                 ===================================================== -->

            <section class="map-section">

                <!-- Sublocation information -->
                <div id="mapHeader" class="map-header">

                    <h2 id="selectedSublocationName">
                        Select a Sublocation
                    </h2>

                    <p id="selectedSublocationDescription">
                        Choose a sublocation from the list to begin exploring.
                    </p>

                </div>


                <!-- Map -->
                <div id="mapContainer" class="map-container hidden">

                    <img
                        id="worldMap"
                        class="world-map"
                        src=""
                        alt="Sublocation Map"
                    >

                    <!-- Area markers -->
                    <div id="areaMarkers"></div>

                    <!-- Area tooltip -->
                    <div id="areaTooltip" class="area-tooltip hidden">

                        <h3 id="tooltipName"></h3>

                        <p id="tooltipDescription"></p>

                        <div class="tooltip-level">
                            Level
                            <span id="tooltipLevel"></span>
                        </div>

                    </div>

                </div>

            </section>

        </main>

    </div>


    <!-- =====================================================
         AREA VIEW OVERLAY
         ===================================================== -->

    <div id="areaViewOverlay" class="area-view-overlay hidden">

        <div class="area-view-content">

            <button id="areaViewClose" class="area-view-close">
                ✕
            </button>

            <h2 id="areaViewName"></h2>

            <div class="area-view-image-wrapper">

                <img
                    id="areaViewImage"
                    class="area-view-image"
                    src=""
                    alt="Area"
                >

                <!-- Area node markers -->
                <div id="areaNodeMarkers"></div>

                <!-- Area node tooltip -->
                <div id="areaNodeTooltip" class="area-tooltip area-node-tooltip hidden">

                    <h3 id="areaNodeTooltipName"></h3>

                    <p id="areaNodeTooltipDescription"></p>

                </div>

            </div>

        </div>

    </div>


    <!-- =====================================================
         NPC DIALOG OVERLAY
         ===================================================== -->

    <div id="npcDialogOverlay" class="npc-dialog-overlay hidden">

        <div class="npc-dialog-content">

            <button id="npcDialogClose" class="area-view-close">
                ✕
            </button>

            <div class="npc-dialog-body">

                <div class="npc-dialog-box">

                    <h2 id="npcDialogName"></h2>

                    <p id="npcDialogText"></p>

                </div>

                <div id="npcQuestPanel" class="npc-quest-panel hidden">
                    <!-- Quest cards inserted here -->
                </div>

            </div>

        </div>

    </div>


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>


    <script>

        let currentCharacter = null;
        let currentLocation = null;
        let currentSublocation = null;


        /* =========================================================
           LOAD CHARACTER
           ========================================================= */

        async function loadCharacter() {

            const {
                data: { user },
                error: userError
            } = await supabaseClient.auth.getUser();


            if (userError || !user) {
                window.location.href = 'login.html';
                return;
            }


            const {
                data: character,
                error: characterError
            } = await supabaseClient
                .from('characters')
                .select('level')
                .eq('user_id', user.id)
                .maybeSingle();


            if (characterError) {

                console.error(
                    'Error loading character:',
                    characterError
                );

                return;
            }


            if (!character) {
                window.location.href = 'character-creation.html';
                return;
            }


            currentCharacter = character;

            await loadLocations();
        }


        /* =========================================================
           LOAD LOCATIONS
           ========================================================= */

        async function loadLocations() {

            const {
                data: locations,
                error
            } = await supabaseClient
                .from('world-locations')
                .select('*')
                .order('id');


            if (error) {

                console.error(
                    'Error loading locations:',
                    error
                );

                return;
            }


            const locationList =
                document.getElementById('locationList');


            locationList.innerHTML = '';


            locations.forEach(location => {

                const levelTooLow =
                    currentCharacter.level <
                    Number(location.level_requirement || 0);


                const locked =
                    !location.is_unlocked ||
                    levelTooLow;


                const locationButton =
                    document.createElement('button');


                locationButton.className =
                    'location-item';


                if (locked) {
                    locationButton.classList.add('locked');
                }


                if (!locked) {

                    locationButton.addEventListener(
                        'click',
                        () => selectLocation(location)
                    );

                }


                const lockIcon = locked ? '🔒' : '';


                let levelText = '';

                if (!location.is_unlocked) {
                    levelText = 'in progress...'
                } else if (Number(location.level_requirement) > currentCharacter.level) {
                    levelText = `Level ${location.level_requirement} required`;
                } else if (currentCharacter.level >= Number(location.level_requirement)) {
                    levelText = `Level ${location.min_level} - ${location.max_level}`;
                }

                locationButton.innerHTML = `

                    <div class="location-item-icon">
                        ${lockIcon}
                    </div>

                    <div class="location-item-content">

                        <div class="location-item-name">
                            ${escapeHtml(location.name)}
                        </div>

                        ${
                            levelText
                                ? `
                                    <div class="location-item-level">
                                        ${levelText}
                                    </div>
                                  `
                                : ''
                        }

                    </div>

                `;


                locationList.appendChild(
                    locationButton
                );

            });


            /* Automatically select first available location */

            const firstAvailable =
                locations.find(location => {

                    const levelTooLow =
                        currentCharacter.level <
                        Number(location.level_requirement || 0);


                    return (
                        location.is_unlocked &&
                        !levelTooLow
                    );

                });


            if (firstAvailable) {
                await selectLocation(firstAvailable);
            }

        }


        /* =========================================================
           SELECT LOCATION
           ========================================================= */

        async function selectLocation(location) {

            currentLocation = location;
            currentSublocation = null;


            /* Highlight selected location */

            document
                .querySelectorAll('.location-item')
                .forEach(button => {

                    button.classList.remove('selected');

                    const nameElement =
                        button.querySelector(
                            '.location-item-name'
                        );


                    if (
                        nameElement &&
                        nameElement.textContent.trim() ===
                        location.name
                    ) {

                        button.classList.add('selected');

                    }

                });

            /* Update sublocation sidebar*/

            document.getElementById('sublocationDescription').textContent = location.description || '';
            document.getElementById('sublocationTitle').textContent = location.name || '';

            /* Clear previous map */

            document
                .getElementById('mapContainer')
                .classList.add('hidden');


            document.getElementById(
                'selectedSublocationName'
            ).textContent =
                'Select a Sublocation';


            document.getElementById(
                'selectedSublocationDescription'
            ).textContent =
                'Choose a sublocation from the list to begin exploring.';


            /* Load sublocations */

            await loadSublocations(location.id);

        }


        /* =========================================================
           LOAD SUBLOCATIONS
           ========================================================= */

        async function loadSublocations(locationId) {

            const {
                data: sublocations,
                error
            } = await supabaseClient
                .from('sublocation')
                .select('*')
                .eq('location_id', locationId)
                .order('id');


            if (error) {

                console.error(
                    'Error loading sublocations:',
                    error
                );

                return;
            }


            const sublocationList =
                document.getElementById(
                    'sublocationList'
                );


            sublocationList.innerHTML = '';


            if (!sublocations || sublocations.length === 0) {

                sublocationList.innerHTML = `
                    <div class="empty-message">
                        No sublocations available.
                    </div>
                `;

                return;
            }
            let lastSublocationLocked = false;
            sublocations.forEach(sublocation => {

                const levelTooLow = currentCharacter.level < Number(sublocation.level_requirement || 0);

                const locked = !sublocation.is_unlocked || levelTooLow;
                
                const button = document.createElement('button');
                button.className = 'location-item sublocation-item';
                
                let subLocationName = `${escapeHtml(sublocation.name)}`;

                if (locked) {
                    button.classList.add('locked');
                    if (lastSublocationLocked) {
                        subLocationName = '???';
                    }
                    lastSublocationLocked = true;
                }

                if (!locked) {
                    button.addEventListener('click',() => selectSublocation(sublocation));
                }

                const lockIcon = locked ? '🔒' : '';
                
                let levelText = '';

                if (!sublocation.is_unlocked) {
                    levelText = 'in progress...'
                } else if (Number(sublocation.level_requirement) > currentCharacter.level) {
                    levelText = `Level ${sublocation.level_requirement} required`;
                } else if (currentCharacter.level >= Number(sublocation.level_requirement)) {
                    levelText = `Level ${sublocation.min_level} - ${sublocation.max_level}`;
                }


                button.innerHTML = `

                    <div class="location-item-icon">
                        ${lockIcon}
                    </div>

                    <div class="location-item-content">

                        <div class="location-item-name">
                            ${subLocationName}
                        </div>

                        ${
                            levelText
                                ? `
                                    <div class="location-item-level">
                                        ${levelText}
                                    </div>
                                  `
                                : ''
                        }

                    </div>

                `;

                sublocationList.appendChild(button);

            });


            /* Automatically select first available sublocation */

            const firstAvailable =
                sublocations.find(sublocation => {

                    const levelTooLow =
                        currentCharacter.level <
                        Number(
                            sublocation.level_requirement || 0
                        );


                    return (
                        sublocation.is_unlocked &&
                        !levelTooLow
                    );

                });


            if (firstAvailable) {
                await selectSublocation(firstAvailable);
            }

        }


        /* =========================================================
           SELECT SUBLOCATION
           ========================================================= */

        async function selectSublocation(sublocation) {

            currentSublocation = sublocation;


            /* Highlight selected sublocation */

            document
                .querySelectorAll('.sublocation-item')
                .forEach(button => {

                    button.classList.remove('selected');

                    const nameElement =
                        button.querySelector(
                            '.location-item-name'
                        );


                    if (
                        nameElement &&
                        nameElement.textContent.trim() ===
                        sublocation.name
                    ) {

                        button.classList.add('selected');

                    }

                });


            /* Update map header */

            document.getElementById(
                'selectedSublocationName'
            ).textContent =
                sublocation.name;


            document.getElementById(
                'selectedSublocationDescription'
            ).textContent =
                sublocation.description || '';


            /* Load map */

            const map =
                document.getElementById('worldMap');


            map.src =
                `locations/${encodeURIComponent(currentLocation.name)}/Map/${encodeURIComponent(sublocation.name)}/${encodeURIComponent(sublocation.image)}.png`;
            console.log(map.src)

            map.alt =
                `${sublocation.name} Map`;


            document
                .getElementById('mapContainer')
                .classList.remove('hidden');


            /* Load areas belonging to this sublocation */

            await loadAreas(sublocation.id);

        }


        /* =========================================================
           LOAD AREAS
           ========================================================= */

        async function loadAreas(sublocationId) {

            const {
                data: areas,
                error
            } = await supabaseClient
                .from('areas')
                .select('*')
                .eq('sublocation_id', sublocationId)
                .order('id');


            if (error) {

                console.error(
                    'Error loading areas:',
                    error
                );

                return;
            }


            const areaMarkers =
                document.getElementById(
                    'areaMarkers'
                );


            areaMarkers.innerHTML = '';


            areas.forEach(area => {

                /*
                 * Locked areas aren't displayed yet.
                 */

                if (!area.is_unlocked) {
                    return;
                }


                const marker =
                    document.createElement('div');


                marker.className =
                    'area-marker';


                /*
                 * map_x / map_y are percentages.
                 */

                marker.style.left =
                    `${area.map_x}%`;

                marker.style.top =
                    `${area.map_y}%`;


                marker.dataset.name =
                    area.name;

                marker.dataset.description =
                    area.description || '';

                marker.dataset.minLevel =
                    area.min_level ?? 1;

                marker.dataset.maxLevel =
                    area.max_level ?? 999;


                /* Hover events */

                marker.addEventListener(
                    'mouseenter',
                    event => {

                        showAreaTooltip(
                            area,
                            event
                        );

                    }
                );


                marker.addEventListener(
                    'mouseleave',
                    hideAreaTooltip
                );


                /* Click event */

                marker.addEventListener(
                    'click',
                    () => openArea(area)
                );


                areaMarkers.appendChild(marker);

            });

        }


        /* =========================================================
           AREA TOOLTIP
           ========================================================= */

        function showAreaTooltip(area, event) {

            const tooltip =
                document.getElementById(
                    'areaTooltip'
                );


            document.getElementById(
                'tooltipName'
            ).textContent =
                area.name;


            document.getElementById(
                'tooltipDescription'
            ).textContent =
                area.description || '';


            document.getElementById(
                'tooltipLevel'
            ).textContent =
                `${area.min_level} - ${area.max_level}`;


            tooltip.style.left =
                `${event.clientX + 15}px`;


            tooltip.style.top =
                `${event.clientY + 15}px`;


            tooltip.classList.remove(
                'hidden'
            );

        }


        /* =========================================================
           HIDE AREA TOOLTIP
           ========================================================= */

        function hideAreaTooltip() {

            document
                .getElementById('areaTooltip')
                .classList.add('hidden');

        }


        /* =========================================================
           OPEN AREA
           ========================================================= */

        function openArea(area) {

            hideAreaTooltip();


            document.getElementById('areaViewName').textContent =
                area.name;


            document.getElementById('areaViewImage').src =
                `locations/${encodeURIComponent(currentLocation.name)}/Map/${encodeURIComponent(currentSublocation.name)}/Areas/${encodeURIComponent(area.image)}.png`;


            document.getElementById('areaViewImage').alt =
                `${area.name} Area`;


            document
                .getElementById('areaViewOverlay')
                .classList.remove('hidden');


            loadAreaNodes(area.id);

        }


        /* =========================================================
           LOAD AREA NODES
           ========================================================= */

        async function loadAreaNodes(areaId) {

            const areaNodeMarkers =
                document.getElementById('areaNodeMarkers');


            areaNodeMarkers.innerHTML = '';


            const {
                data: areaNodes,
                error
            } = await supabaseClient
                .from('area_nodes')
                .select('*')
                .eq('area_id', areaId)
                .order('id');


            if (error) {

                console.error(
                    'Error loading area nodes:',
                    error
                );

                return;
            }


            areaNodes.forEach(node => {

                const marker =
                    document.createElement('div');


                marker.className =
                    'area-marker';


                /*
                 * area_x / area_y are percentages.
                 */

                marker.style.left =
                    `${node.area_x}%`;

                marker.style.top =
                    `${node.area_y}%`;


                marker.addEventListener(
                    'mouseenter',
                    event => showAreaNodeTooltip(node, event)
                );


                marker.addEventListener(
                    'mouseleave',
                    hideAreaNodeTooltip
                );


                marker.addEventListener(
                    'click',
                    () => openAreaNode(node)
                );


                areaNodeMarkers.appendChild(marker);

            });

        }


        /* =========================================================
           AREA NODE TOOLTIP
           ========================================================= */

        function showAreaNodeTooltip(node, event) {

            const tooltip =
                document.getElementById('areaNodeTooltip');


            document.getElementById(
                'areaNodeTooltipName'
            ).textContent =
                node.name;


            document.getElementById(
                'areaNodeTooltipDescription'
            ).textContent =
                node.description || '';


            tooltip.style.left =
                `${event.clientX + 15}px`;


            tooltip.style.top =
                `${event.clientY + 15}px`;


            tooltip.classList.remove('hidden');

        }


        function hideAreaNodeTooltip() {

            document
                .getElementById('areaNodeTooltip')
                .classList.add('hidden');

        }


        /* =========================================================
           OPEN AREA NODE
           ========================================================= */

        function openAreaNode(node) {

            hideAreaNodeTooltip();


            if (node.node_type === 'npcs') {
                openNpcDialog(node.entity_id);
            }

        }


        /* =========================================================
           NPC DIALOG
           ========================================================= */

        let activeQuestIds = new Set();


        async function openNpcDialog(npcId) {

            const {
                data: npc,
                error
            } = await supabaseClient
                .from('npcs')
                .select('*')
                .eq('id', npcId)
                .maybeSingle();


            if (error || !npc) {

                console.error(
                    'Error loading npc:',
                    error
                );

                return;
            }


            document.getElementById('npcDialogName').textContent =
                npc.name;


            document.getElementById('npcDialogText').textContent =
                npc.dialog || '';


            await loadActiveQuestIds();

            await loadNpcQuests(npcId);


            document
                .getElementById('npcDialogOverlay')
                .classList.remove('hidden');

        }


        /* =========================================================
           LOAD ACTIVE QUEST IDS
           ========================================================= */

        async function loadActiveQuestIds() {

            const {
                data,
                error
            } = await supabaseClient.functions.invoke(
                'get_active_quests'
            );


            if (error || !data?.success) {

                console.error(
                    'Error loading active quests:',
                    error
                );

                activeQuestIds = new Set();

                return;
            }


            activeQuestIds = new Set(
                data.quests
                    .filter(characterQuest => characterQuest.quests)
                    .map(characterQuest => characterQuest.quests.id)
            );

        }


        /* =========================================================
           LOAD NPC QUESTS
           ========================================================= */

        async function loadNpcQuests(npcId) {

            const questPanel =
                document.getElementById('npcQuestPanel');


            questPanel.innerHTML = '';


            const {
                data: npcQuests,
                error
            } = await supabaseClient
                .from('npc_quests')
                .select('*, quests(*)')
                .eq('npc_id', npcId);


            if (error || !npcQuests || npcQuests.length === 0) {
                questPanel.classList.add('hidden');
                return;
            }


            questPanel.classList.remove('hidden');


            const title =
                document.createElement('div');

            title.className = 'npc-quest-panel-title';
            title.textContent = 'Quests';

            questPanel.appendChild(title);


            npcQuests
                .filter(npcQuest => npcQuest.quests)
                .forEach(npcQuest => {
                    renderNpcQuestCard(questPanel, npcQuest.quests);
                });

        }


        /* =========================================================
           RENDER NPC QUEST CARD
           ========================================================= */

        function renderNpcQuestCard(container, quest) {

            const card =
                document.createElement('div');


            card.className = 'npc-quest-card';


            const levelMet =
                currentCharacter.level >=
                Number(quest.level_requirement ?? 0);

            const alreadyActive =
                activeQuestIds.has(quest.id);


            card.innerHTML = `

                <h3>${escapeHtml(quest.name)}</h3>

                <p>${escapeHtml(quest.description || '')}</p>

                <div class="npc-quest-reward">
                    Gold: ${quest.gold_reward ?? 0} | EXP: ${quest.experience_reward ?? 0}
                </div>

                <div class="npc-quest-status"></div>

            `;


            const statusElement =
                card.querySelector('.npc-quest-status');


            if (alreadyActive) {

                statusElement.textContent =
                    'Quest already active.';

            } else if (!levelMet) {

                statusElement.textContent =
                    `Requires Level ${quest.level_requirement}`;

            } else {

                const acceptButton =
                    document.createElement('button');

                acceptButton.className = 'accept-quest-btn';
                acceptButton.textContent = 'Accept Quest';

                acceptButton.addEventListener(
                    'click',
                    () => acceptNpcQuest(quest, card)
                );

                statusElement.appendChild(acceptButton);

            }


            container.appendChild(card);

        }


        /* =========================================================
           ACCEPT NPC QUEST
           ========================================================= */

        async function acceptNpcQuest(quest, card) {

            const statusElement =
                card.querySelector('.npc-quest-status');


            if (activeQuestIds.size >= 3) {

                statusElement.textContent =
                    'You can only have up to 3 active quests at a time.';

                return;
            }


            if (activeQuestIds.has(quest.id)) {

                statusElement.textContent =
                    'This quest is already active.';

                return;
            }


            const {
                data,
                error
            } = await supabaseClient.functions.invoke(
                'accept_quest',
                {
                    body: {
                        quest_id: quest.id
                    }
                }
            );


            if (error) {

                let errorMessage = 'Could not accept quest.';

                if (error.context) {

                    try {

                        const response =
                            await error.context.clone().json();

                        if (response?.error) {
                            errorMessage = response.error;
                        }

                    } catch (e) {
                        console.error('Could not parse Edge Function error:', e);
                    }

                }

                statusElement.textContent = errorMessage;

                return;
            }


            if (!data?.success) {

                statusElement.textContent =
                    data?.error || 'Could not accept quest.';

                return;
            }


            activeQuestIds.add(quest.id);

            statusElement.textContent = 'Quest accepted!';

        }


        /* =========================================================
           CLOSE NPC DIALOG
           ========================================================= */

        function closeNpcDialog() {

            document
                .getElementById('npcDialogOverlay')
                .classList.add('hidden');

        }


        document
            .getElementById('npcDialogClose')
            .addEventListener('click', closeNpcDialog);


        document
            .getElementById('npcDialogOverlay')
            .addEventListener('click', event => {

                if (event.target.id === 'npcDialogOverlay') {
                    closeNpcDialog();
                }

            });


        /* =========================================================
           CLOSE AREA
           ========================================================= */

        function closeArea() {

            document
                .getElementById('areaViewOverlay')
                .classList.add('hidden');


            hideAreaNodeTooltip();

        }


        document
            .getElementById('areaViewClose')
            .addEventListener('click', closeArea);


        document
            .getElementById('areaViewOverlay')
            .addEventListener('click', event => {

                if (event.target.id === 'areaViewOverlay') {
                    closeArea();
                }

            });


        /* =========================================================
           HTML ESCAPING
           ========================================================= */

        function escapeHtml(value) {

            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');

        }


        /* =========================================================
           START
           ========================================================= */

        loadCharacter();

    </script>

</body>

</html>
