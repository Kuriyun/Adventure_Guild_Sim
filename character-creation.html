<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Character - Dark Fantasy RPG</title>
    <link rel="stylesheet" href="game-style.css">

    <style>
        /* Keep a larger class roster contained inside the creation card. */
        .classes-container {
            max-height: 300px;
            overflow-y: auto;
            overflow-x: hidden;

            padding-right: 6px;

            scrollbar-width: thin;
            scrollbar-color:
                rgba(212, 175, 55, 0.65)
                rgba(10, 14, 39, 0.45);
        }

        .classes-container::-webkit-scrollbar {
            width: 7px;
        }

        .classes-container::-webkit-scrollbar-track {
            background: rgba(10, 14, 39, 0.45);
            border-radius: 10px;
        }

        .classes-container::-webkit-scrollbar-thumb {
            background: rgba(212, 175, 55, 0.65);
            border-radius: 10px;
        }

        .classes-container::-webkit-scrollbar-thumb:hover {
            background: rgba(212, 175, 55, 0.85);
        }
    </style>

</head>

<body>

    <div id="creationPanel" class="creation-panel">

        <div class="creation-content">

            <!-- Intro Box -->
            <div class="creation-intro">
                <div class="creation-badge">Realm Gateway</div>

                <h1>Forge Your Hero</h1>

                <p>
                    Choose the name you want to be known by in this realm.
                    You can change it later from this page.
                </p>
            </div>


            <!-- Character Creation Box -->
            <div class="creation-layout">

                <!-- Left: Character Creation -->
                <div class="creation-card">

                    <form id="createCharacterForm" class="creation-form">

                        <div class="field creation-field">
                            <label for="classSelect">
                                Choose Your Class
                            </label>

                            <div id="classesContainer" class="classes-container"></div>
                        </div>

                        <div class="field creation-field">
                            <label for="characterNameInput">
                                Character Name
                            </label>

                            <input
                                id="characterNameInput"
                                class="name-input"
                                type="text"
                                maxlength="20"
                                placeholder="Enter your character name"
                                required
                            >
                        </div>

                        <button
                            type="submit"
                            class="primary-btn save-name-btn">
                            Create Character
                        </button>

                        <div
                            id="creationMessage"
                            class="form-message"
                            aria-live="polite">
                        </div>

                    </form>

                </div>


                <!-- Right: Selected Class Preview -->
                <div class="class-preview">

                    <div class="class-preview-title">
                        Selected Class
                    </div>

                    <img
                        id="selectedClassIcon"
                        class="selected-class-icon"
                        src=""
                        alt="Selected class"
                    >

                    <h2 id="selectedClassName">Warrior</h2>

                    <p id="selectedClassDescription">
                        Select a class to see its description.
                    </p>

                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script>
        const createCharacterForm = document.getElementById('createCharacterForm');
        const creationMessage = document.getElementById('creationMessage');
        const classesContainer = document.getElementById('classesContainer');
        const selectedClassIcon = document.getElementById('selectedClassIcon');
        const selectedClassName = document.getElementById('selectedClassName');
        const selectedClassDescription = document.getElementById('selectedClassDescription');
        let selectedClassId = null;
        let availableClasses = [];

        function showMessage(element, text, isError = true) {
            element.textContent = text;
            element.classList.toggle('show', Boolean(text));
            element.style.color = isError ? '#ff8c6b' : '#7ce08a';
        }

        async function loadClasses() {
            try {
                // First, let's check all classes without filter
                const { data: allClasses, error: allError } = await supabaseClient
                    .from('classes')
                    .select('*');

                console.log('All classes:', allClasses);
                console.log('All classes error:', allError);

                if (allError) {
                    throw allError;
                }

                // Now get filtered classes
                const { data, error } = await supabaseClient
                    .from('classes')
                    .select('id, name, description')
                    .eq('minimum_level', 1);

                if (error) {
                    throw error;
                }

                console.log('Filtered classes (minimum_level = 1):', data);
                availableClasses = data || [];
                displayClasses();
            } catch (error) {
                console.error('Error loading classes:', error);
                showMessage(creationMessage, 'Could not load character classes. Please refresh the page.', true);
            }
        }

        function displayClasses() {
            classesContainer.innerHTML = '';

            if (availableClasses.length === 0) {
                classesContainer.innerHTML = '<p>No classes available</p>';
                return;
            }

            availableClasses.forEach(classItem => {
                const classBox = document.createElement('div');
                classBox.className = 'class-option';

                const isWarrior = classItem.name.toLowerCase() === 'warrior';

                classBox.innerHTML = `
                    <input 
                        type="radio" 
                        id="class-${classItem.id}" 
                        name="classSelect" 
                        value="${classItem.id}" 
                        ${isWarrior ? 'checked' : ''}
                        required
                    >

                    <label for="class-${classItem.id}" class="class-label">
                        <img 
                            src="classes/${classItem.name}/ClassIcon/${classItem.name}.png" 
                            alt="${classItem.name}" 
                            class="class-icon"
                        >

                        <div class="class-info">
                            <div class="class-name">${classItem.name}</div>
                        </div>
                    </label>
                `;

                const radio = classBox.querySelector(`#class-${classItem.id}`);

                radio.addEventListener('change', () => {
                    selectedClassId = classItem.id;

                    updateClassPreview(classItem);
                });

                if (isWarrior) {
                    selectedClassId = classItem.id;
                    updateClassPreview(classItem);
                }

                classesContainer.appendChild(classBox);
            });
        }

        function updateClassPreview(classItem) {
            selectedClassIcon.src = `classes/${classItem.name}/ClassIcon/${classItem.name}.png`;
            selectedClassIcon.alt = classItem.name;
            selectedClassName.textContent = classItem.name;
            selectedClassDescription.textContent = classItem.description;
        }
        async function createCharacter(name, classId) {

            const {
                data: { user },
                error: userError
            } = await supabaseClient.auth.getUser();


            if (userError || !user) {
                window.location.href = 'login.html';
                return null;
            }


            const {
                data,
                error
            } = await supabaseClient.functions.invoke(
                'create_character',
                {
                    body: {
                        name,
                        class_id: Number(classId)
                    }
                }
            );


            if (error) {

                let errorMessage =
                    'Could not create your character. Please try again.';


                if (error.context) {

                    try {

                        const response =
                            await error.context
                                .clone()
                                .json();


                        console.error(
                            'create_character response:',
                            response
                        );


                        if (response?.error) {
                            errorMessage =
                                response.error;
                        }

                    } catch (parseError) {

                        console.error(
                            'Could not parse create_character error:',
                            parseError
                        );

                    }

                }


                const wrappedError =
                    new Error(errorMessage);


                wrappedError.originalError =
                    error;


                throw wrappedError;
            }


            if (!data?.success) {

                throw new Error(
                    data?.error ||
                    'Could not create your character. Please try again.'
                );

            }


            return data.character ||
                null;

        }

        async function checkExistingCharacter() {
            const {
                data: { user },
                error: userError
            } = await supabaseClient.auth.getUser();

            if (userError || !user) {
                window.location.href = 'login.html';
                return;
            }

            const {
                data: character,
                error: characterError
            } = await supabaseClient
                .from('characters')
                .select('*')
                .eq('user_id', user.id)
                .maybeSingle();

            if (characterError) {
                console.error('Error checking character:', characterError);
                return;
            }

            if (character) {
                // Character already exists, redirect to character page
                window.location.href = 'character.html';
                return;
            }
        }

        createCharacterForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const name = document.getElementById('characterNameInput').value.trim();

            if (!name || name.length < 2) {
                showMessage(creationMessage, 'Your character name must be at least 2 characters long.', true);
                return;
            }

            if (!selectedClassId) {
                showMessage(creationMessage, 'Please select a class.', true);
                return;
            }

            try {
                const newCharacter = await createCharacter(name, selectedClassId);
                if (!newCharacter) {
                    return;
                }

                showMessage(creationMessage, 'Character created successfully.', false);
                // Redirect to character page after a short delay
                setTimeout(() => {
                    window.location.href = 'character.html';
                }, 1000);
            } catch (error) {
                console.error('Create character error:', error);

                showMessage(
                    creationMessage,
                    error?.message ||
                    'Could not create your character. Please try again.',
                    true
                );
            }
        });

        // Check if user already has a character and load classes
        checkExistingCharacter();
        loadClasses();
    </script>
</body>

</html>
