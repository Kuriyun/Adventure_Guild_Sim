<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Character - Dark Fantasy RPG</title>
    <link rel="stylesheet" href="game-style.css">

    <style>
        /*
         * Character creation polish
         *
         * Keeps the existing dark navy / gold visual language,
         * but improves spacing, hierarchy and the larger class roster.
         */

        .creation-content {
            width: min(1120px, calc(100% - 48px));
            margin: 0 auto;
        }


        .creation-intro {
            max-width: 720px;
            margin-bottom: 24px;
        }


        .creation-intro h1 {
            margin-top: 7px;
            margin-bottom: 7px;
        }


        .creation-intro p {
            max-width: 620px;
            line-height: 1.55;
        }


        .creation-layout {
            display: grid;
            grid-template-columns:
                minmax(520px, 1.35fr)
                minmax(300px, 0.65fr);

            gap: 24px;
            align-items: stretch;
        }


        .creation-card,
        .class-preview {
            min-width: 0;
        }


        .creation-card {
            padding: 28px;
        }


        .creation-form {
            display: flex;
            flex-direction: column;
            gap: 22px;
        }


        .creation-field {
            margin: 0;
        }


        .creation-field > label {
            display: block;

            margin-bottom: 10px;

            color: #d4af37;

            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.065em;
            text-transform: uppercase;
        }


        /*
         * Class selector becomes a contained panel rather than letting
         * the individual class cards visually run into the name field.
         */
        .classes-container {
            display: grid;
            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 10px;

            max-height: 300px;
            overflow-y: auto;
            overflow-x: hidden;

            padding: 10px;

            border:
                1px solid
                rgba(212, 175, 55, 0.30);

            border-radius: 11px;

            background:
                linear-gradient(
                    145deg,
                    rgba(10, 14, 39, 0.56),
                    rgba(15, 19, 40, 0.82)
                );

            box-shadow:
                inset 0 0 18px
                rgba(0, 0, 0, 0.20);

            scrollbar-width: thin;
            scrollbar-color:
                rgba(212, 175, 55, 0.58)
                rgba(7, 10, 25, 0.42);
        }


        .classes-container::-webkit-scrollbar {
            width: 6px;
        }


        .classes-container::-webkit-scrollbar-track {
            background:
                rgba(7, 10, 25, 0.42);

            border-radius: 10px;
        }


        .classes-container::-webkit-scrollbar-thumb {
            background:
                rgba(212, 175, 55, 0.58);

            border-radius: 10px;
        }


        .classes-container::-webkit-scrollbar-thumb:hover {
            background:
                rgba(212, 175, 55, 0.82);
        }


        .class-option {
            min-width: 0;
        }


        .class-label {
            min-height: 72px;

            display: flex;
            align-items: center;

            gap: 12px;

            padding: 9px 12px;

            border-radius: 9px;

            transition:
                border-color 0.18s ease,
                background 0.18s ease,
                box-shadow 0.18s ease,
                transform 0.18s ease;
        }


        .class-label:hover {
            transform: translateY(-1px);
        }


        .class-icon {
            width: 50px;
            height: 50px;

            flex: 0 0 50px;

            object-fit: contain;
        }


        .class-name {
            overflow: hidden;

            font-size: 15px;
            letter-spacing: 0.045em;

            text-overflow: ellipsis;
            white-space: nowrap;
        }


        /*
         * Give the name field its own visual section.
         */
        .creation-field:has(.name-input) {
            padding-top: 18px;

            border-top:
                1px solid
                rgba(212, 175, 55, 0.16);
        }


        .name-input {
            width: 100%;
            min-height: 46px;

            padding-left: 14px;
            padding-right: 14px;

            border-radius: 8px;
        }


        .save-name-btn {
            width: 100%;
            min-height: 48px;

            margin-top: 2px;

            border-radius: 8px;

            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.025em;
        }


        /*
         * Make the preview feel like part of the same interface instead
         * of a mostly empty secondary box.
         */
        .class-preview {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            min-height: 100%;

            padding: 30px 26px;

            text-align: center;
        }


        .class-preview-title {
            margin-bottom: 20px;

            color: #d4af37;

            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.11em;
            text-transform: uppercase;
        }


        .selected-class-icon {
            width: 158px;
            height: 158px;

            margin-bottom: 18px;

            object-fit: contain;

            filter:
                drop-shadow(
                    0 0 14px
                    rgba(212, 175, 55, 0.10)
                );
        }


        .class-preview h2 {
            margin-bottom: 10px;

            color: #f0d968;

            font-size: 25px;
            letter-spacing: 0.04em;
        }


        .class-preview p {
            max-width: 280px;

            line-height: 1.6;

            color: #b7bcc9;
        }


        .form-message {
            min-height: 18px;
            margin-top: -8px;
        }


        @media (max-width: 900px) {

            .creation-content {
                width:
                    min(
                        680px,
                        calc(100% - 30px)
                    );
            }


            .creation-layout {
                grid-template-columns: 1fr;
            }


            .class-preview {
                min-height: 320px;
            }

        }


        @media (max-width: 560px) {

            .creation-card {
                padding: 20px;
            }


            .classes-container {
                grid-template-columns: 1fr;

                max-height: 330px;
            }


            .class-label {
                min-height: 66px;
            }


            .selected-class-icon {
                width: 130px;
                height: 130px;
            }

        }
    </style>


    <style>
        /* =========================================================
           LEFT-ALIGNED CREATION LAYOUT
           ========================================================= */

        .creation-content {
            width: min(1120px, calc(100% - 48px));

            margin-left: 6%;
            margin-right: auto;
        }


        /* =========================================================
           CLEANER INTRO / HEADER
           ========================================================= */

        .creation-intro {
            max-width: 760px;

            margin-bottom: 24px;
            padding: 0 4px 18px;

            border: none;
            border-bottom:
                1px solid
                rgba(212, 175, 55, 0.24);

            border-radius: 0;

            background: transparent;

            box-shadow: none;
        }


        .creation-badge {
            display: inline-block;

            margin-bottom: 8px;
            padding: 4px 9px;

            border:
                1px solid
                rgba(212, 175, 55, 0.45);

            border-radius: 999px;

            background:
                rgba(212, 175, 55, 0.07);

            color: #d4af37;

            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.10em;
            text-transform: uppercase;
        }


        .creation-intro h1 {
            margin: 0 0 7px;

            color: #f0d968;

            font-size: 31px;
            line-height: 1.1;
        }


        .creation-intro p {
            max-width: 640px;

            margin: 0;

            color: #aeb4c2;

            line-height: 1.55;
        }


        @media (max-width: 900px) {

            .creation-content {
                width:
                    min(
                        680px,
                        calc(100% - 30px)
                    );

                margin-left: auto;
                margin-right: auto;
            }

        }
    </style>

</head>

<body>

    <div id="creationPanel" class="creation-panel">

        <div class="creation-content">

            <!-- Intro Box -->
            <div class="creation-intro">
                <div class="creation-badge">Realm Gateway</div>

                <h1>Forge Your Hero</h1>

                <p>
                    Choose the name you want to be known by in this realm.
                    You can change it later from this page.
                </p>
            </div>


            <!-- Character Creation Box -->
            <div class="creation-layout">

                <!-- Left: Character Creation -->
                <div class="creation-card">

                    <form id="createCharacterForm" class="creation-form">

                        <div class="field creation-field">
                            <label for="classSelect">
                                Choose Your Class
                            </label>

                            <div id="classesContainer" class="classes-container"></div>
                        </div>

                        <div class="field creation-field">
                            <label for="characterNameInput">
                                Character Name
                            </label>

                            <input
                                id="characterNameInput"
                                class="name-input"
                                type="text"
                                maxlength="20"
                                placeholder="Enter your character name"
                                required
                            >
                        </div>

                        <button
                            type="submit"
                            class="primary-btn save-name-btn">
                            Create Character
                        </button>

                        <div
                            id="creationMessage"
                            class="form-message"
                            aria-live="polite">
                        </div>

                    </form>

                </div>


                <!-- Right: Selected Class Preview -->
                <div class="class-preview">

                    <div class="class-preview-title">
                        Selected Class
                    </div>

                    <img
                        id="selectedClassIcon"
                        class="selected-class-icon"
                        src=""
                        alt="Selected class"
                    >

                    <h2 id="selectedClassName">Warrior</h2>

                    <p id="selectedClassDescription">
                        Select a class to see its description.
                    </p>

                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script>
        const createCharacterForm = document.getElementById('createCharacterForm');
        const creationMessage = document.getElementById('creationMessage');
        const classesContainer = document.getElementById('classesContainer');
        const selectedClassIcon = document.getElementById('selectedClassIcon');
        const selectedClassName = document.getElementById('selectedClassName');
        const selectedClassDescription = document.getElementById('selectedClassDescription');
        let selectedClassId = null;
        let availableClasses = [];

        function showMessage(element, text, isError = true) {
            element.textContent = text;
            element.classList.toggle('show', Boolean(text));
            element.style.color = isError ? '#ff8c6b' : '#7ce08a';
        }

        async function loadClasses() {
            try {
                // First, let's check all classes without filter
                const { data: allClasses, error: allError } = await supabaseClient
                    .from('classes')
                    .select('*');

                console.log('All classes:', allClasses);
                console.log('All classes error:', allError);

                if (allError) {
                    throw allError;
                }

                // Now get filtered classes
                const { data, error } = await supabaseClient
                    .from('classes')
                    .select('id, name, description')
                    .eq('minimum_level', 1);

                if (error) {
                    throw error;
                }

                console.log('Filtered classes (minimum_level = 1):', data);
                availableClasses = data || [];
                displayClasses();
            } catch (error) {
                console.error('Error loading classes:', error);
                showMessage(creationMessage, 'Could not load character classes. Please refresh the page.', true);
            }
        }

        function displayClasses() {
            classesContainer.innerHTML = '';

            if (availableClasses.length === 0) {
                classesContainer.innerHTML = '<p>No classes available</p>';
                return;
            }

            availableClasses.forEach(classItem => {
                const classBox = document.createElement('div');
                classBox.className = 'class-option';

                const isWarrior = classItem.name.toLowerCase() === 'warrior';

                classBox.innerHTML = `
                    <input 
                        type="radio" 
                        id="class-${classItem.id}" 
                        name="classSelect" 
                        value="${classItem.id}" 
                        ${isWarrior ? 'checked' : ''}
                        required
                    >

                    <label for="class-${classItem.id}" class="class-label">
                        <img 
                            src="classes/${classItem.name}/ClassIcon/${classItem.name}.png" 
                            alt="${classItem.name}" 
                            class="class-icon"
                        >

                        <div class="class-info">
                            <div class="class-name">${classItem.name}</div>
                        </div>
                    </label>
                `;

                const radio = classBox.querySelector(`#class-${classItem.id}`);

                radio.addEventListener('change', () => {
                    selectedClassId = classItem.id;

                    updateClassPreview(classItem);
                });

                if (isWarrior) {
                    selectedClassId = classItem.id;
                    updateClassPreview(classItem);
                }

                classesContainer.appendChild(classBox);
            });
        }

        function updateClassPreview(classItem) {
            selectedClassIcon.src = `classes/${classItem.name}/ClassIcon/${classItem.name}.png`;
            selectedClassIcon.alt = classItem.name;
            selectedClassName.textContent = classItem.name;
            selectedClassDescription.textContent = classItem.description;
        }
        async function createCharacter(name, classId) {

            const {
                data: { user },
                error: userError
            } = await supabaseClient.auth.getUser();


            if (userError || !user) {
                window.location.href = 'login.html';
                return null;
            }


            const {
                data,
                error
            } = await supabaseClient.functions.invoke(
                'create_character',
                {
                    body: {
                        name,
                        class_id: Number(classId)
                    }
                }
            );


            if (error) {

                let errorMessage =
                    'Could not create your character. Please try again.';


                if (error.context) {

                    try {

                        const response =
                            await error.context
                                .clone()
                                .json();


                        console.error(
                            'create_character response:',
                            response
                        );


                        if (response?.error) {
                            errorMessage =
                                response.error;
                        }

                    } catch (parseError) {

                        console.error(
                            'Could not parse create_character error:',
                            parseError
                        );

                    }

                }


                const wrappedError =
                    new Error(errorMessage);


                wrappedError.originalError =
                    error;


                throw wrappedError;
            }


            if (!data?.success) {

                throw new Error(
                    data?.error ||
                    'Could not create your character. Please try again.'
                );

            }


            return data.character ||
                null;

        }

        async function checkExistingCharacter() {
            const {
                data: { user },
                error: userError
            } = await supabaseClient.auth.getUser();

            if (userError || !user) {
                window.location.href = 'login.html';
                return;
            }

            const {
                data: character,
                error: characterError
            } = await supabaseClient
                .from('characters')
                .select('*')
                .eq('user_id', user.id)
                .maybeSingle();

            if (characterError) {
                console.error('Error checking character:', characterError);
                return;
            }

            if (character) {
                // Character already exists, redirect to character page
                window.location.href = 'character.html';
                return;
            }
        }

        createCharacterForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const name = document.getElementById('characterNameInput').value.trim();

            if (!name || name.length < 2) {
                showMessage(creationMessage, 'Your character name must be at least 2 characters long.', true);
                return;
            }

            if (!selectedClassId) {
                showMessage(creationMessage, 'Please select a class.', true);
                return;
            }

            try {
                const newCharacter = await createCharacter(name, selectedClassId);
                if (!newCharacter) {
                    return;
                }

                showMessage(creationMessage, 'Character created successfully.', false);
                // Redirect to character page after a short delay
                setTimeout(() => {
                    window.location.href = 'character.html';
                }, 1000);
            } catch (error) {
                console.error('Create character error:', error);

                showMessage(
                    creationMessage,
                    error?.message ||
                    'Could not create your character. Please try again.',
                    true
                );
            }
        });

        // Check if user already has a character and load classes
        checkExistingCharacter();
        loadClasses();
    </script>
</body>

</html>
