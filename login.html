<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Fantasy RPG - Login</title>
    <link rel="stylesheet" href="game-style.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, rgba(26, 31, 58, 0.8), rgba(10, 14, 39, 0.98));
            padding: 20px;
        }

        .auth-shell {
            width: min(100%, 440px);
            display: flex;
            justify-content: center;
        }

        .auth-card {
            width: 100%;
            background: linear-gradient(135deg, #1a1f3a 0%, #242b3d 100%);
            border: 2px solid #d4af37;
            border-radius: 16px;
            padding: 28px 24px;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.6);
        }

        .auth-badge {
            display: inline-block;
            background: rgba(212, 175, 55, 0.12);
            color: #f0d968;
            border: 1px solid #d4af37;
            border-radius: 999px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.12em;
            padding: 6px 12px;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .auth-card h1 {
            color: #d4af37;
            font-size: clamp(30px, 4vw, 38px);
            margin-bottom: 8px;
        }

        .auth-card p {
            color: #b0b0b0;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.5;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 18px;
        }

        .field label {
            color: #d4af37;
            font-size: 13px;
            font-weight: bold;
        }

        .field input {
            background: rgba(15, 18, 25, 0.9);
            border: 1px solid #3d4452;
            border-radius: 8px;
            color: #f5f5f5;
            padding: 12px 14px;
            font-size: 16px;
            outline: none;
        }

        .field input:focus {
            border-color: #d4af37;
            box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.18);
        }

        .primary-btn,
        .secondary-btn,
        .ghost-btn {
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Georgia', serif;
            font-weight: bold;
            transition: all 0.25s ease;
        }

        .primary-btn {
            padding: 12px 16px;
            border: none;
            background: linear-gradient(135deg, #d4af37 0%, #f0d968 100%);
            color: #140f07;
            margin-top: 8px;
        }

        .secondary-btn {
            padding: 11px 16px;
            margin-top: 10px;
            border: 2px solid #d4af37;
            background: transparent;
            color: #d4af37;
        }

        .ghost-btn {
            padding: 10px 16px;
            background: transparent;
            border: none;
            color: #d7d7d7;
            text-decoration: underline;
            margin-top: 10px;
        }

        .primary-btn:hover,
        .secondary-btn:hover,
        .ghost-btn:hover {
            transform: translateY(-1px);
        }

        .form-message {
            min-height: 20px;
            margin-top: 12px;
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .form-message.error {
            color: #ff8c6b;
            opacity: 1;
        }

        .form-message.success {
            color: #7ce08a;
            opacity: 1;
        }
    </style>
</head>

<body>
    <div class="auth-shell">
        <div class="auth-card">
            <div class="auth-badge">Realm Gateway</div>
            <h1 id="authTitle">Login</h1>
            <p id="authSubtitle">Enter your credentials to continue your journey.</p>

            <form id="authForm">
                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" autocomplete="email" required>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" maxlength="40" required>
                </div>

                <button id="submitBtn" type="submit" class="primary-btn">Login</button>
                <button id="secondaryActionBtn" type="button" class="secondary-btn">Create Account</button>

                <div id="formMessage" class="form-message" aria-live="polite"></div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <script>
        const authForm = document.getElementById('authForm');
        const authTitle = document.getElementById('authTitle');
        const authSubtitle = document.getElementById('authSubtitle');
        const submitBtn = document.getElementById('submitBtn');
        const secondaryActionBtn = document.getElementById('secondaryActionBtn');
        const formMessage = document.getElementById('formMessage');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');

        let authMode = 'login';

        function setMessage(text, type = 'error') {
            formMessage.textContent = text;
            formMessage.className = 'form-message ' + type;
        }

        function updateAuthMode(mode) {
            authMode = mode;
            const isLogin = mode === 'login';

            authTitle.textContent = isLogin ? 'Login' : 'Create Account';
            authSubtitle.textContent = isLogin
                ? 'Enter your credentials to login to your account.'
                : 'Create an account to begin your journey.';
            submitBtn.textContent = isLogin ? 'Login' : 'Create Account';
            secondaryActionBtn.textContent = isLogin ? 'Create Account' : 'Back to Login';
            setMessage('', 'error');
            emailInput.value = '';
            passwordInput.value = '';
            emailInput.focus();
        }

        async function createAccount(email, password) {
            const { data, error } = await supabaseClient.auth.signUp({
                email: email,
                password: password
            });

            if (error) {
                throw error;
            }

            return data;
        }

        async function loginAccount(email, password) {
            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                throw error;
            }

            return data;
        }

        async function getUserCharacter(userId) {
            const { data, error } = await supabaseClient
                .from('characters')
                .select('id')
                .eq('user_id', userId)
                .maybeSingle();

            if (error) {
                throw error;
            }

            return data;
        }

        function saveSession(userEmail) {
            const SESSION_KEY = 'dark-fantasy-rpg-session-v1';
            localStorage.setItem(SESSION_KEY, userEmail || 'Adventurer');
        }

        async function routeAfterAuth(userId, userEmail) {
            saveSession(userEmail);
            const character = await getUserCharacter(userId);
            window.location.href = character ? 'index.html' : 'character.html';
        }

        authForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                setMessage('Both email and password are required.', 'error');
                return;
            }

            try {
                if (authMode === 'login') {
                    const data = await loginAccount(email, password);
                    await routeAfterAuth(data.user.id, data.user.email);
                    return;
                }

                const data = await createAccount(email, password);

                if (!data.session) {
                    throw new Error('Account was created, but no login session was created.');
                }

                await routeAfterAuth(data.user.id, data.user.email);
            } catch (error) {
                setMessage(
                    error.message || 'Unable to complete your request.',
                    'error'
                );
            }
        });

        secondaryActionBtn.addEventListener('click', () => {
            if (authMode === 'login') {
                updateAuthMode('signup');
                return;
            }

            updateAuthMode('login');
        });

        updateAuthMode('login');
    </script>
</body>

</html>
